services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      AHL_WEB_API_KEY: ${AHL_WEB_API_KEY:?Set a random AHL_WEB_API_KEY in .env}
      AHL_DATA_DIR: /data
    volumes:
      - archive:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gateway:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      AHL_PUBLIC_IP: ${AHL_PUBLIC_IP:?Set the server public IP in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  archive:
  certificates:
  caddy-config:
