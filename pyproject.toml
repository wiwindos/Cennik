[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ahledger-historical"
version = "1.0.0"
description = "Resumable archival downloader for the public AHledger API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "duckdb>=1.2,<2", "pyarrow>=19,<25", "zstandard>=0.23,<1", "typer>=0.15,<1", "rich>=13,<15", "pytz>=2025.1"]

[project.optional-dependencies]
web = ["fastapi>=0.143,<0.144", "uvicorn>=0.54,<0.55"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
ahledger = "ahledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahledger = ["static/*.html", "static/*.css", "static/*.js"]
cennik = ["licenses/*.txt", "THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: optional live API tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
