data_dir = "data"
# Empty means all discovered markets; CLI --market overrides this list for one run.
markets = []
requests_per_second = 1.0
tools_per_second = 0.5
concurrency = 2
connect_timeout = 10.0
read_timeout = 30.0
max_attempts = 5
max_response_bytes = 67108864
# All catalog IDs are checked, including items missing from today's price tables.
full_history_check = true
# The compact catalog lacks vendor fields; all enables deduplicated item enrichment.
enrich_items = "all"
# Only 12 meaningful model variants; no brute-force deal filter combinations.
signal_variants = true
discovery_ttl_hours = 24
